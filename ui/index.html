<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Revive</title>
<style>
/* shadcn/ui neutral tokens, verbatim */
:root{
  --background:0 0% 100%; --foreground:0 0% 3.9%;
  --card:0 0% 100%; --card-foreground:0 0% 3.9%;
  --muted:0 0% 96.1%; --muted-foreground:0 0% 45.1%;
  --border:0 0% 89.8%; --input:0 0% 89.8%; --ring:0 0% 3.9%;
  --primary:0 0% 9%; --primary-foreground:0 0% 98%;
  --secondary:0 0% 96.1%; --secondary-foreground:0 0% 9%;
  --destructive:0 84.2% 60.2%; --destructive-foreground:0 0% 98%;
  --success:142 71% 45%;
  --radius:0.5rem;
}
@media (prefers-color-scheme:dark){
  :root{
    --background:0 0% 3.9%; --foreground:0 0% 98%;
    --card:0 0% 3.9%; --card-foreground:0 0% 98%;
    --muted:0 0% 14.9%; --muted-foreground:0 0% 63.9%;
    --border:0 0% 14.9%; --input:0 0% 14.9%; --ring:0 0% 83.1%;
    --primary:0 0% 98%; --primary-foreground:0 0% 9%;
    --secondary:0 0% 14.9%; --secondary-foreground:0 0% 98%;
    --destructive:0 62.8% 45%; --destructive-foreground:0 0% 98%;
    --success:142 60% 42%;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:hsl(var(--background)); color:hsl(var(--foreground));
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}

/* layout */
.wrap{max-width:1180px;margin:0 auto;padding:24px 24px 96px}
header{display:flex;align-items:baseline;gap:12px;margin-bottom:4px}
h1{font-size:20px;font-weight:600;letter-spacing:-.01em}
.sub{color:hsl(var(--muted-foreground));font-size:13px;margin-bottom:20px}

/* tabs */
.tabs{display:inline-flex;gap:4px;padding:4px;border-radius:var(--radius);
  background:hsl(var(--muted));margin-bottom:22px}
.tab{appearance:none;border:0;background:transparent;cursor:pointer;
  font:500 13px/1 inherit;color:hsl(var(--muted-foreground));
  padding:8px 14px;border-radius:calc(var(--radius) - 2px)}
.tab[aria-selected="true"]{background:hsl(var(--background));
  color:hsl(var(--foreground));box-shadow:0 1px 2px rgb(0 0 0/.08)}

.cols{display:grid;grid-template-columns:212px 1fr;gap:22px;align-items:start}
@media(max-width:820px){.cols{grid-template-columns:1fr}}

/* folder rail */
.rail h2{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:hsl(var(--muted-foreground));margin-bottom:8px}
.fold{display:flex;align-items:center;gap:8px;width:100%;cursor:pointer;
  appearance:none;border:1px solid transparent;background:transparent;
  color:hsl(var(--foreground));font:inherit;text-align:left;
  padding:7px 9px;border-radius:calc(var(--radius) - 2px);margin-bottom:2px}
.fold:hover{background:hsl(var(--muted))}
.fold[aria-current="true"]{background:hsl(var(--muted));
  border-color:hsl(var(--border));font-weight:500}
.fold .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fold .tot{color:hsl(var(--muted-foreground));font-size:12px}
/* count of sessions you have ticked inside that folder */
.pick{min-width:19px;height:19px;padding:0 5px;border-radius:999px;
  background:hsl(var(--primary));color:hsl(var(--primary-foreground));
  font:600 11px/19px ui-monospace,Menlo,monospace;text-align:center}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.card{position:relative;border:1px solid hsl(var(--border));border-radius:var(--radius);
  background:hsl(var(--card));padding:14px 15px;cursor:pointer;
  transition:border-color .12s,box-shadow .12s}
.card:hover{border-color:hsl(var(--foreground)/.28)}
.card[data-on="1"]{border-color:hsl(var(--foreground)/.55);
  box-shadow:0 0 0 1px hsl(var(--foreground)/.55)}
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.cb{width:16px;height:16px;flex:none;border:1px solid hsl(var(--foreground)/.35);
  border-radius:4px;display:grid;place-items:center;background:hsl(var(--background))}
.card[data-on="1"] .cb{background:hsl(var(--primary));border-color:hsl(var(--primary))}
.cb svg{width:11px;height:11px;stroke:hsl(var(--primary-foreground));
  stroke-width:3;fill:none;visibility:hidden}
.card[data-on="1"] .cb svg{visibility:visible}
.open{font-size:12px;color:hsl(var(--muted-foreground));flex:1}
.card[data-on="1"] .open{color:hsl(var(--foreground))}
.badge{font:500 11px/1 inherit;padding:4px 8px;border-radius:999px;white-space:nowrap;
  border:1px solid transparent}
/* Filled chips, saturated fill, black text in both themes (per the sketch). */
.badge{color:#000;font-weight:600}
.b-crash {background:#ef4444}
.b-killed{background:#f59e0b}
.b-rec   {background:#22c55e}
.b-run   {background:#a1a1aa}
.b-other {background:#d4d4d8}
.sid{font-size:12px;color:hsl(var(--muted-foreground));margin-bottom:3px}
.nme{font-weight:600;font-size:14px;margin-bottom:5px;letter-spacing:-.005em}
.dsc{font-size:13px;color:hsl(var(--muted-foreground));
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card[data-run="1"]{opacity:.6;cursor:default}
.card[data-run="1"] .cb{border-style:dashed;background:hsl(var(--muted))}
.meta.path{margin-top:2px;padding-top:0;border:0}
.meta{margin-top:9px;padding-top:9px;border-top:1px solid hsl(var(--border));
  font-size:12px;color:hsl(var(--muted-foreground));
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* skills */
.inp{width:100%;padding:9px 11px;border:1px solid hsl(var(--input));
  border-radius:calc(var(--radius) - 2px);background:hsl(var(--background));
  color:hsl(var(--foreground));font:inherit;margin-bottom:14px}
.inp:focus{outline:2px solid hsl(var(--ring));outline-offset:-1px}
.srow{padding:11px 0;border-bottom:1px solid hsl(var(--border))}
.srow b{font-weight:600}
.srow p{color:hsl(var(--muted-foreground));font-size:13px;margin-top:2px}

/* action bar */
.bar{position:fixed;left:0;right:0;bottom:0;border-top:1px solid hsl(var(--border));
  background:hsl(var(--background)/.92);backdrop-filter:blur(8px);
  padding:12px 24px;display:flex;align-items:center;gap:14px;justify-content:flex-end}
.bar .info{margin-right:auto;font-size:13px;color:hsl(var(--muted-foreground))}
.btn{appearance:none;border:1px solid hsl(var(--border));cursor:pointer;
  font:500 13px/1 inherit;padding:9px 15px;border-radius:calc(var(--radius) - 2px);
  background:hsl(var(--background));color:hsl(var(--foreground))}
.btn:hover{background:hsl(var(--muted))}
.btn.primary{background:hsl(var(--primary));color:hsl(var(--primary-foreground));
  border-color:hsl(var(--primary))}
.btn.primary:hover{opacity:.9}
.btn:disabled{opacity:.45;cursor:not-allowed}
.empty{color:hsl(var(--muted-foreground));padding:44px 0;text-align:center}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>Revive</h1><span class="sub" id="hdr"></span></header>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" aria-selected="true"  data-tab="sessions">Sessions</button>
    <button class="tab" role="tab" aria-selected="false" data-tab="skills">Skills</button>
  </div>

  <section id="pane-sessions">
    <div class="cols">
      <nav class="rail"><h2>Folders</h2><div id="folders"></div></nav>
      <div><div class="grid" id="cards"></div><div class="empty" id="none" hidden>Nothing to revive.</div></div>
    </div>
  </section>

  <section id="pane-skills" hidden>
    <input class="inp" id="q" placeholder="Search 0 skills" autocomplete="off">
    <div id="skills"></div>
  </section>
</div>

<div class="bar">
  <span class="info" id="info">Loading</span>
  <button class="btn" id="none-btn">Clear</button>
  <button class="btn primary" id="go" disabled>Restore</button>
</div>

<script>
const $ = s => document.querySelector(s);
let DATA = {sessions:[],folders:[],skills:[],windows:0};
let picked = new Set();      // survives folder switches, that is the point
let folder = null;           // null = All

const badgeClass = s => ({CRASHED:'b-crash',BACKFILL:'b-crash',TERMINATED:'b-killed',EXITED:'b-rec',RUNNING:'b-run'})[s] || 'b-other';
const esc = t => String(t??'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// Keep the meaningful tail of a path without breaking the leading slash.
const shortPath = p => {
  const parts = String(p||'').split('/').filter(Boolean);
  return parts.length <= 3 ? (p||'') : '.../' + parts.slice(-3).join('/');
};

function visible(){
  return folder === null ? DATA.sessions : DATA.sessions.filter(s => s.folder === folder);
}

function renderFolders(){
  const el = $('#folders');
  const chosenIn = n => DATA.sessions.filter(s => s.folder === n && picked.has(s.id)).length;
  const row = (name, label, total, sel, on) => `
    <button class="fold" aria-current="${on}" data-f="${name===null?'':esc(name)}" data-all="${name===null}">
      <span class="nm">${esc(label)}</span>
      ${sel ? `<span class="pick">${sel}</span>` : `<span class="tot">${total}</span>`}
    </button>`;
  el.innerHTML =
    row(null, 'All folders', DATA.sessions.length, picked.size, folder === null) +
    DATA.folders.map(f => row(f.name, f.name, f.count, chosenIn(f.name), folder === f.name)).join('');
  el.querySelectorAll('.fold').forEach(b => b.onclick = () => {
    folder = b.dataset.all === 'true' ? null : b.dataset.f;
    render();
  });
}

function renderCards(){
  const list = visible();
  $('#none').hidden = list.length > 0;
  $('#cards').innerHTML = list.map(s => `
    <article class="card" data-id="${esc(s.id)}" data-on="${picked.has(s.id)?1:0}"
             data-run="${s.running?1:0}" title="${s.running?'Still running, cannot be restored':''}">
      <div class="top">
        <span class="cb"><svg viewBox="0 0 12 12"><polyline points="1.5,6.5 4.5,9.5 10.5,2.5"/></svg></span>
        <span class="open">${s.running ? 'Still open' : 'Open session'}</span>
        <span class="badge ${badgeClass(s.state)}">${esc(s.badge)}</span>
      </div>
      <div class="sid mono">${esc(s.short)}</div>
      <div class="nme">${esc(s.folder)}</div>
      <div class="dsc">${esc(s.prompt) || '<i>no recorded prompt</i>'}</div>
      <div class="meta mono">${esc(s.windowLabel)} &middot; ${esc(s.ago)} ago</div>
      <div class="meta mono path" title="${esc(s.cwd)}">${esc(shortPath(s.cwd))}</div>
    </article>`).join('');
  $('#cards').querySelectorAll('.card').forEach(c => c.onclick = () => {
    if (c.dataset.run === '1') return;          // running sessions are not restorable
    const id = c.dataset.id;
    picked.has(id) ? picked.delete(id) : picked.add(id);
    render();
  });
}

function renderBar(){
  const n = picked.size;
  const wins = new Set(DATA.sessions.filter(s => picked.has(s.id)).map(s => s.window)).size;
  const fols = new Set(DATA.sessions.filter(s => picked.has(s.id)).map(s => s.folder)).size;
  $('#info').textContent = n === 0
    ? `${DATA.sessions.length} recoverable across ${DATA.folders.length} folders`
    : `${n} selected across ${fols} folder${fols===1?'':'s'}, restoring into ${wins} window${wins===1?'':'s'}`;
  $('#go').disabled = n === 0;
  $('#go').textContent = n === 0 ? 'Restore' : `Restore ${n}`;
}

function renderSkills(){
  const q = $('#q').value.trim().toLowerCase();
  const list = DATA.skills.filter(s =>
    !q || s.name.toLowerCase().includes(q) || (s.description||'').toLowerCase().includes(q));
  $('#q').placeholder = `Search ${DATA.skills.length} skills`;
  $('#skills').innerHTML = list.length
    ? list.map(s => `<div class="srow"><b class="mono">${esc(s.name)}</b><p>${esc(s.description)}</p></div>`).join('')
    : '<div class="empty">No matching skills.</div>';
}

function render(){ renderFolders(); renderCards(); renderBar(); }

document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
  document.querySelectorAll('.tab').forEach(x => x.setAttribute('aria-selected', x === t));
  $('#pane-sessions').hidden = t.dataset.tab !== 'sessions';
  $('#pane-skills').hidden   = t.dataset.tab !== 'skills';
});
$('#q').oninput = renderSkills;
$('#none-btn').onclick = () => { picked.clear(); render(); };

$('#go').onclick = async () => {
  $('#go').disabled = true; $('#go').textContent = 'Restoring';
  try{
    const r = await fetch('/api/restore', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ids:[...picked]})
    }).then(r => r.json());
    $('#info').textContent =
      `Restored ${r.restored} session(s) into ${r.windows.length} Cursor window(s). You can close this tab.`;
    $('#go').textContent = 'Done';
    picked.clear(); renderFolders(); renderCards();
    fetch('/api/shutdown', {method:'POST'}).catch(()=>{});
  }catch(e){
    $('#info').textContent = 'Restore failed: ' + e;
    $('#go').disabled = false; $('#go').textContent = 'Restore';
  }
};

fetch('/api/state').then(r => r.json()).then(d => {
  DATA = d;
  picked = new Set(d.sessions.filter(s => !s.running).map(s => s.id));  // like Chrome
  $('#hdr').textContent = `${d.sessions.length} sessions recoverable`;
  render(); renderSkills();
});
</script>
</body>
</html>
